name: Hardware physical verification

on:
  push:
    branches: [main, 'codex/20260711-physical-validation', 'codex/20260711-wre-validation']
    paths:
      - 'hw/**'
      - '.github/workflows/hardware-physical.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-physical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: '1'
      SWAY_OSS_SHA256: 4f9bd79d3deb022d9b44f65242617d06f64159dfff222eda89ed093afde95f5b
      SWAY_BSC_SHA256: e79f93d8e72bc1278766502fc49dc555d935e194ac34e5958d4053390c38878c
      SWAY_BLUEYOSYS_COMMIT: 3663e87b88146c248919923ea952e025944ca3e0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        timeout-minutes: 15
        run: |
          mkdir -p ci-evidence "$RUNNER_TEMP/sway-tools/bin"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential ca-certificates curl git gzip tar python3 \
            libgmp-dev libffi-dev tcl-dev iverilog
          sway_tools="$RUNNER_TEMP/sway-tools"
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-07-11/oss-cad-suite-linux-x64-20260711.tgz \
            --output "$sway_tools/oss-cad-suite.tgz"
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/B-Lang-org/bsc/releases/download/2025.07/bsc-2025.07-ubuntu-24.04.tar.gz \
            --output "$sway_tools/bsc.tar.gz"
          printf '%s  %s\n' "$SWAY_OSS_SHA256" "$sway_tools/oss-cad-suite.tgz" \
            "$SWAY_BSC_SHA256" "$sway_tools/bsc.tar.gz" | sha256sum --check --strict
          tar -xzf "$sway_tools/oss-cad-suite.tgz" -C "$sway_tools"
          tar -xzf "$sway_tools/bsc.tar.gz" -C "$sway_tools"
          git init "$sway_tools/blueyosys"
          git -C "$sway_tools/blueyosys" remote add origin https://github.com/SeMinLim/blueyosys.git
          git -C "$sway_tools/blueyosys" fetch --depth 1 origin "$SWAY_BLUEYOSYS_COMMIT"
          git -C "$sway_tools/blueyosys" checkout --detach FETCH_HEAD
          test "$(git -C "$sway_tools/blueyosys" rev-parse HEAD)" = "$SWAY_BLUEYOSYS_COMMIT"
          printf '%s  %s\n' \
            7899a5aa8e35ad6896b12d564318cf613e8cc48e89b85ba6b75f3042de83d320 \
            "$sway_tools/blueyosys/build.mk" | sha256sum --check --strict
          # Expose only selected EDA executables; retain system Python and Icarus.
          for sway_tool in yosys nextpnr-ecp5 ecppack; do
            cat > "$sway_tools/bin/$sway_tool" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          sway_tool="${0##*/}"
          export GHDL_PREFIX="$SWAY_SUITE_ROOT/lib/ghdl"
          export TCL_LIBRARY="$SWAY_SUITE_ROOT/lib/tcl8.6"
          exec "$SWAY_SUITE_ROOT/lib/ld-linux-x86-64.so.2" \
            --inhibit-cache --inhibit-rpath '' --library-path "$SWAY_SUITE_ROOT/lib" \
            "$SWAY_SUITE_ROOT/libexec/$sway_tool" "$@"
          WRAPPER
            chmod +x "$sway_tools/bin/$sway_tool"
          done
          cat > "$sway_tools/bin/yosys-config" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$SWAY_SUITE_ROOT/bin/yosys-config" "$@"
          WRAPPER
          chmod +x "$sway_tools/bin/yosys-config"
          printf '%s\n' "$sway_tools/bin" "$sway_tools/bsc-2025.07-ubuntu-24.04/bin" >> "$GITHUB_PATH"
          printf 'SWAY_SUITE_ROOT=%s\nSWAY_BLUEYOSYS_ROOT=%s\n' \
            "$sway_tools/oss-cad-suite" "$sway_tools/blueyosys" >> "$GITHUB_ENV"

      - name: Record source and tool provenance
        run: |
          {
            git rev-parse HEAD
            bsc -v
            yosys -V
            nextpnr-ecp5 --version
            ecppack --version
            uname -a
            free -h
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          } 2>&1 | tee ci-evidence/environment.log
          yosys -V | grep -F 'Yosys 0.67+24 (git sha1 0e82bbefe'
          nextpnr-ecp5 --version 2>&1 | grep -F 'nextpnr-0.10-82-g2b560ad0'
          bsc -v | grep -F 'version 2025.07 (build 282e82e9)'
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          sources = {p: sha(p) for p in files if p}
          pathlib.Path('ci-evidence/source-sha256.json').write_text(json.dumps(sources, indent=2) + '\n')
          suite = pathlib.Path(os.environ['SWAY_SUITE_ROOT'])
          tools = {str(p.relative_to(suite)): sha(p) for p in
                   [suite / 'libexec' / name for name in ('yosys', 'nextpnr-ecp5', 'ecppack')]}
          record = dict(commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                        oss_cad_suite='2026-07-11', oss_archive_sha256=os.environ['SWAY_OSS_SHA256'],
                        bsc='2025.07', bsc_archive_sha256=os.environ['SWAY_BSC_SHA256'],
                        blueyosys_commit=os.environ['SWAY_BLUEYOSYS_COMMIT'], tool_sha256=tools,
                        target_mhz={'core': 100, 'uart': 25})
          pathlib.Path('ci-evidence/provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - name: Regression tests for mapped-cell and timing checks
        run: |
          python3 -m unittest discover -s hw/reference -p 'test_address_replicas.py'
          python3 -m unittest discover -s hw/reference -p 'test_physical_settings.py'
          python3 hw/reference/test_mapped_ccu2c.py \
            --cells-sim "$SWAY_SUITE_ROOT/share/yosys/ecp5/cells_sim.v"

      - name: Build, place, route and pack at strict baseline clocks
        id: build
        timeout-minutes: 330
        run: |
          # This adds evidence output only; all physical settings come from hw/Makefile.
          cat > "$RUNNER_TEMP/sway-evidence.mk" <<'MAKE'
          BOARD_PNR_FLAGS += --detailed-timing-report --write "$(BUILD_DIR)/mkTop.routed.json"
          MAKE
          status=0
          /usr/bin/time -v make -C hw -f Makefile -f "$RUNNER_TEMP/sway-evidence.mk" synth \
            ROOTDIR="$SWAY_BLUEYOSYS_ROOT" BUILD_DIR="$GITHUB_WORKSPACE/ci-evidence/build" \
            2>&1 | tee ci-evidence/make-synth.log || status=$?
          printf '%s\n' "$status" > ci-evidence/make-exit-status.txt
          exit "$status"

      - name: Verify completed timing and bitstream evidence
        id: verify
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('hw/reference').resolve()))
          from check_physical import verify_clocks, verify_router_settings, verify_reset_placement
          from check_lut_mapping import inspect_state_block_ram
          root = pathlib.Path('ci-evidence')
          build = root / 'build'
          clocks = verify_clocks(json.loads((build / 'mkTop.nextpnr.json').read_text()))
          if not all(item['pass'] for item in clocks.values()):
              raise RuntimeError('Both baseline clock targets must pass')
          settings = verify_router_settings(build / 'mkTop.routed.json', require_ripup=True)
          reset = verify_reset_placement((root / 'make-synth.log').read_text(), build / 'mkTop.routed.json')
          state_ram = inspect_state_block_ram(json.loads((build / 'mkTop.routed.json').read_text()))
          if not state_ram['pass']:
              raise RuntimeError('Routed state memory differs from baseline')
          for name, expected in json.loads((root / 'source-sha256.json').read_text()).items():
              if hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() != expected:
                  raise RuntimeError('Tracked source changed during validation: ' + name)
          weights = json.loads((build / 'mapped_weights.json').read_text())
          mapping = json.loads((build / 'lut_mapping.json').read_text())
          if (weights['status'] != 'pass' or weights['coefficient_addresses_checked'] != 139264
                  or weights['mismatched_addresses'] != 0 or mapping['status'] != 'pass'):
              raise RuntimeError('Full mapped coefficient validation did not pass')
          for name in ('mkTop.config', 'mkTop.bit'):
              if not (build / name).is_file() or (build / name).stat().st_size == 0:
                  raise RuntimeError('Missing physical output: ' + name)
          bit = build / 'mkTop.bit'
          result = dict(status='pass', clocks=clocks, settings=settings, reset=reset, state_ram=state_ram,
                        sources_unchanged=True,
                        coefficient_addresses_checked=weights['coefficient_addresses_checked'],
                        mismatched_addresses=weights['mismatched_addresses'],
                        bitstream_sha256=hashlib.sha256(bit.read_bytes()).hexdigest())
          (root / 'physical-result.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Strict synthesis, placement, routing and bitstream packing passed.\n\n')
              summary.write('| Clock | Required MHz | Achieved MHz |\n|---|---:|---:|\n')
              for name, item in clocks.items():
                  summary.write(f"| {name} | {item['required_mhz']} | {item['achieved_mhz']:.6f} |\n")
          print(json.dumps(result, indent=2))
          PY

      - name: Finalize evidence on success or failure
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          mkdir -p ci-evidence
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('ci-evidence')
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          changes = []
          source_manifest = root / 'source-sha256.json'
          if source_manifest.exists():
              for path, expected in json.loads(source_manifest.read_text()).items():
                  if not pathlib.Path(path).is_file() or sha(path) != expected:
                      changes.append(path)
          outcome = dict(build=os.environ['BUILD_OUTCOME'], verification=os.environ['VERIFY_OUTCOME'],
                         changed_sources=changes, source_manifest_present=source_manifest.exists())
          # An absent exit-status file means the build did not return normally.
          outcome['build_returned'] = (root / 'make-exit-status.txt').exists()
          (root / 'run-outcome.json').write_text(json.dumps(outcome, indent=2) + '\n')
          hashes = {str(p.relative_to(root)): sha(p) for p in sorted(root.rglob('*'))
                    if p.is_file() and p.name != 'artifact-sha256.json'}
          (root / 'artifact-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
          if changes:
              raise RuntimeError('Tracked sources changed during validation: ' + repr(changes))
          PY

      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardware-physical-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
