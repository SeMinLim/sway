name: Baseline source snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/sway-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect public synthesis dependency
        run: |
          sudo apt-get update -qq
          mkdir -p /tmp/sway-abc
          cd /tmp/sway-abc
          apt-get download yosys-abc
      - uses: actions/upload-artifact@v4
        with:
          name: sway-abc-dependency
          path: /tmp/sway-abc/*.deb
          retention-days: 1
