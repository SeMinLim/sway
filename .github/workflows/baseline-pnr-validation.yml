name: Baseline FPGA validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-pnr-validation-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  functional:
    name: Functional divisor ${{ matrix.divisor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        divisor: [1, 2, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified BSC and Icarus
        id: tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sway-tools/bsc" "$RUNNER_TEMP/sway-verification"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ca-certificates curl git make g++ python3 iverilog libgmp10 libtcl8.6 libstdc++6
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bsc.tar.gz" "https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz"
          printf '%s  %s\n' '6d13db288cf268dc1331f05b277c414b4ff1c1ab9618a6526ba16ad29e484e43' "$RUNNER_TEMP/bsc.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/bsc.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/sway-tools/bsc"
          echo "$RUNNER_TEMP/sway-tools/bsc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" -v > "$RUNNER_TEMP/sway-verification/bsc-version.txt" 2>&1
          /usr/bin/iverilog -V > "$RUNNER_TEMP/sway-verification/iverilog-version.txt" 2>&1
          git rev-parse HEAD > "$RUNNER_TEMP/sway-verification/sway-commit.txt"
          cat "$RUNNER_TEMP/sway-verification/bsc-version.txt"
      - name: Verify stress and kernel outputs
        run: |
          set -euo pipefail
          ulimit -v 6291456
          python3 hw/reference/check_refactor.py \
            --bsc "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" \
            --backend iverilog --iverilog /usr/bin/iverilog --vvp /usr/bin/vvp \
            --divisors ${{ matrix.divisor }} --modes stress kernel --skip-arithmetic \
            --output "$RUNNER_TEMP/sway-verification/functional" \
            2>&1 | tee "$RUNNER_TEMP/sway-verification/functional-run.log"
      - name: Verify in-flight warm reset at divisor 4
        if: ${{ always() && matrix.divisor == 4 && steps.tools.outcome == 'success' }}
        run: |
          set -euo pipefail
          ulimit -v 6291456
          python3 -c 'import pathlib,re; s=pathlib.Path("hw/bsv/SwayTypes.bsv").read_text(); assert re.search(r"typedef\s+4\s+ParallelismDivisor;", s), "Warm-reset source must be divisor 4"'
          python3 hw/reference/check_warm_reset.py \
            --hw-root "$GITHUB_WORKSPACE/hw" \
            --bsc "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" \
            --iverilog /usr/bin/iverilog --vvp /usr/bin/vvp \
            --output "$RUNNER_TEMP/sway-verification/warm-reset" \
            2>&1 | tee "$RUNNER_TEMP/sway-verification/warm-reset-run.log"
      - name: Publish factual report summaries
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "sway-verification"
          summaries = []
          candidates = [base / "functional/validation.json", base / "warm-reset/result.json",
                        base / "physical/report.json"]
          for path in candidates:
              if not path.is_file():
                  continue
              result = json.loads(path.read_text())
              print(f"SWAY_REPORT {path.relative_to(base)}")
              print(json.dumps(result, indent=2))
              hashes = result.get("source_sha256", {})
              digest = hashlib.sha256(json.dumps(hashes, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              summary = {"report": str(path.relative_to(base)), "status": result.get("status"),
                         "error": result.get("error"), "source_files": len(hashes),
                         "source_manifest_sha256": digest,
                         "source_hashes_unchanged": result.get("source_hashes_unchanged", result.get("source_unchanged")),
                         "reported_clocks": result.get("reported_clocks"),
                         "configurations": [{"divisor": x.get("parallelism_divisor"), "mode": x.get("mode"),
                                             "status": x.get("status"), "outputs": x.get("scalar_outputs_checked")}
                                            for x in result.get("configurations", [])]}
              summaries.append(summary)
          detail = base / "physical/nextpnr.json"
          if detail.is_file():
              result = json.loads(detail.read_text())
              compact = {key: result[key] for key in ("fmax", "critical_paths") if key in result}
              compact["detailed_report_sha256"] = hashlib.sha256(detail.read_bytes()).hexdigest()
              (base / "physical/timing_summary.json").write_text(json.dumps(compact, indent=2) + "\n")
              print("SWAY_ROUTED_FMAX " + json.dumps(result.get("fmax", {}), sort_keys=True))
              print("SWAY_ROUTED_CRITICAL_PATHS " + json.dumps(result.get("critical_paths", []), sort_keys=True))
              slow = []
              for net in result.get("detailed_net_timings", []):
                  if "100mhz" not in net.get("event", ""):
                      continue
                  for endpoint in net.get("endpoints", []):
                      if "100mhz" in endpoint.get("event", "") and max(endpoint["delay"]) > 9.5:
                          slow.append({"delay": max(endpoint["delay"]), "driver": net["driver"], "net": net["net"],
                                       "cell": endpoint["cell"], "port": endpoint["port"]})
              slow.sort(key=lambda item: item["delay"], reverse=True)
              print("SWAY_SLOW_ENDPOINTS " + json.dumps(slow[:200], sort_keys=True))
          base.mkdir(parents=True, exist_ok=True)
          (base / "ci-summary.json").write_text(json.dumps(summaries, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("Commit: " + os.environ["GITHUB_SHA"] + "\n\n")
              fence = chr(96) * 3
              output.write(fence + "json\n" + json.dumps(summaries, indent=2) + "\n" + fence + "\n")
              if not summaries:
                  output.write("No checker report was produced; inspect setup/build logs.\n")
          PY
      - name: Preserve functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-functional-divisor-${{ matrix.divisor }}-${{ github.sha }}
          path: ${{ runner.temp }}/sway-verification/
          if-no-files-found: warn
          compression-level: 6

  physical:
    name: ULX3S-85F strict 100 MHz and 25 MHz
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified BSC and Icarus
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sway-tools/bsc" "$RUNNER_TEMP/sway-verification"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ca-certificates curl git make g++ python3 iverilog libgmp10 libtcl8.6 libstdc++6
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bsc.tar.gz" "https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz"
          printf '%s  %s\n' '6d13db288cf268dc1331f05b277c414b4ff1c1ab9618a6526ba16ad29e484e43' "$RUNNER_TEMP/bsc.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/bsc.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/sway-tools/bsc"
          echo "$RUNNER_TEMP/sway-tools/bsc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" -v > "$RUNNER_TEMP/sway-verification/bsc-version.txt" 2>&1
          /usr/bin/iverilog -V > "$RUNNER_TEMP/sway-verification/iverilog-version.txt" 2>&1
          git rev-parse HEAD > "$RUNNER_TEMP/sway-verification/sway-commit.txt"
          cat "$RUNNER_TEMP/sway-verification/bsc-version.txt"
      - name: Install pinned synthesis and place-and-route tools
        run: |
          set -euo pipefail
          sudo apt-get install --no-install-recommends -y yosys=0.33-5build2 yosys-abc=0.33-5build2
          /usr/bin/yosys -V | tee "$RUNNER_TEMP/sway-verification/yosys-version.txt"
          python3 -c 'import subprocess; v=subprocess.check_output(["/usr/bin/yosys","-V"],text=True); assert v.startswith("Yosys 0.33 "),v'
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-26/oss-cad-suite-linux-x64-20260926.tgz
          printf '%s  %s\n' '3c829c389b981cbd51cee259eac3e44352074df1d24e3fe6ec8b6b8baf596aae' "$RUNNER_TEMP/oss-cad-suite.tgz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$RUNNER_TEMP/sway-tools"
          "$RUNNER_TEMP/sway-tools/oss-cad-suite/bin/nextpnr-ecp5" --version \
            > "$RUNNER_TEMP/sway-verification/nextpnr-version.txt" 2>&1
          cat "$RUNNER_TEMP/sway-verification/nextpnr-version.txt"
          python3 -c 'import os,pathlib; v=(pathlib.Path(os.environ["RUNNER_TEMP"])/"sway-verification/nextpnr-version.txt").read_text(); assert "1aea87ab" in v,v'
          git clone https://github.com/SeMinLim/blueyosys.git "$RUNNER_TEMP/sway-tools/blueyosys"
          git -C "$RUNNER_TEMP/sway-tools/blueyosys" checkout --detach 3663e87b88146c248919923ea952e025944ca3e0
          test "$(git -C "$RUNNER_TEMP/sway-tools/blueyosys" rev-parse HEAD)" = 3663e87b88146c248919923ea952e025944ca3e0
          git -C "$RUNNER_TEMP/sway-tools/blueyosys" rev-parse HEAD > "$RUNNER_TEMP/sway-verification/blueyosys-commit.txt"
      - name: Synthesize, place, route and enforce both clocks
        run: |
          set -euo pipefail
          ulimit -v 6291456
          python3 hw/reference/check_physical.py \
            --rootdir "$RUNNER_TEMP/sway-tools/blueyosys" \
            --bsc "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" \
            --yosys /usr/bin/yosys \
            --nextpnr "$RUNNER_TEMP/sway-tools/oss-cad-suite/bin/nextpnr-ecp5" \
            --output "$RUNNER_TEMP/sway-verification/physical" \
            2>&1 | tee "$RUNNER_TEMP/sway-verification/physical-run.log"
      - name: Generate bitstream after strict physical pass
        run: |
          set -euo pipefail
          ulimit -v 6291456
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"sway-verification/physical/report.json"; assert json.loads(p.read_text())["status"] == "pass"'
          "$RUNNER_TEMP/sway-tools/oss-cad-suite/bin/ecppack" --idcode 0x41113043 \
            "$RUNNER_TEMP/sway-verification/physical/mkTop.config" \
            "$RUNNER_TEMP/sway-verification/physical/mkTop.bit" \
            2>&1 | tee "$RUNNER_TEMP/sway-verification/ecppack.log"
          test -s "$RUNNER_TEMP/sway-verification/physical/mkTop.bit"
          sha256sum "$RUNNER_TEMP/sway-verification/physical/mkTop.bit" \
            > "$RUNNER_TEMP/sway-verification/physical/bitstream.sha256"
      - name: Publish factual report summaries
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "sway-verification"
          summaries = []
          candidates = [base / "functional/validation.json", base / "warm-reset/result.json",
                        base / "physical/report.json"]
          for path in candidates:
              if not path.is_file():
                  continue
              result = json.loads(path.read_text())
              print(f"SWAY_REPORT {path.relative_to(base)}")
              print(json.dumps(result, indent=2))
              hashes = result.get("source_sha256", {})
              digest = hashlib.sha256(json.dumps(hashes, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              summary = {"report": str(path.relative_to(base)), "status": result.get("status"),
                         "error": result.get("error"), "source_files": len(hashes),
                         "source_manifest_sha256": digest,
                         "source_hashes_unchanged": result.get("source_hashes_unchanged", result.get("source_unchanged")),
                         "reported_clocks": result.get("reported_clocks"),
                         "configurations": [{"divisor": x.get("parallelism_divisor"), "mode": x.get("mode"),
                                             "status": x.get("status"), "outputs": x.get("scalar_outputs_checked")}
                                            for x in result.get("configurations", [])]}
              summaries.append(summary)
          detail = base / "physical/nextpnr.json"
          if detail.is_file():
              result = json.loads(detail.read_text())
              compact = {key: result[key] for key in ("fmax", "critical_paths") if key in result}
              compact["detailed_report_sha256"] = hashlib.sha256(detail.read_bytes()).hexdigest()
              (base / "physical/timing_summary.json").write_text(json.dumps(compact, indent=2) + "\n")
              print("SWAY_ROUTED_FMAX " + json.dumps(result.get("fmax", {}), sort_keys=True))
              print("SWAY_ROUTED_CRITICAL_PATHS " + json.dumps(result.get("critical_paths", []), sort_keys=True))
              slow = []
              for net in result.get("detailed_net_timings", []):
                  if "100mhz" not in net.get("event", ""):
                      continue
                  for endpoint in net.get("endpoints", []):
                      if "100mhz" in endpoint.get("event", "") and max(endpoint["delay"]) > 9.5:
                          slow.append({"delay": max(endpoint["delay"]), "driver": net["driver"], "net": net["net"],
                                       "cell": endpoint["cell"], "port": endpoint["port"]})
              slow.sort(key=lambda item: item["delay"], reverse=True)
              print("SWAY_SLOW_ENDPOINTS " + json.dumps(slow[:200], sort_keys=True))
          base.mkdir(parents=True, exist_ok=True)
          (base / "ci-summary.json").write_text(json.dumps(summaries, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("Commit: " + os.environ["GITHUB_SHA"] + "\n\n")
              fence = chr(96) * 3
              output.write(fence + "json\n" + json.dumps(summaries, indent=2) + "\n" + fence + "\n")
              if not summaries:
                  output.write("No checker report was produced; inspect setup/build logs.\n")
          PY
      - name: Preserve physical evidence including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-physical-${{ github.sha }}
          path: ${{ runner.temp }}/sway-verification/
          if-no-files-found: warn
          compression-level: 6

  native:
    name: Native multiplier boundary, stall and reset
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install verified BSC and Icarus
        id: tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sway-tools/bsc" "$RUNNER_TEMP/sway-verification"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ca-certificates curl git make g++ python3 iverilog libgmp10 libtcl8.6 libstdc++6
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bsc.tar.gz" "https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-ubuntu-24.04.tar.gz"
          printf '%s  %s\n' '6d13db288cf268dc1331f05b277c414b4ff1c1ab9618a6526ba16ad29e484e43' "$RUNNER_TEMP/bsc.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/bsc.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/sway-tools/bsc"
          echo "$RUNNER_TEMP/sway-tools/bsc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" -v > "$RUNNER_TEMP/sway-verification/bsc-version.txt" 2>&1
          /usr/bin/iverilog -V > "$RUNNER_TEMP/sway-verification/iverilog-version.txt" 2>&1
          git rev-parse HEAD > "$RUNNER_TEMP/sway-verification/sway-commit.txt"
          cat "$RUNNER_TEMP/sway-verification/bsc-version.txt"
      - name: Check three simulation backends and operand control isolation
        run: |
          set -euo pipefail
          python3 hw/reference/native_multiply/check_native_multiply.py \
            --hw-root "$GITHUB_WORKSPACE/hw" \
            --bsc "$RUNNER_TEMP/sway-tools/bsc/bin/bsc" \
            --iverilog /usr/bin/iverilog --vvp /usr/bin/vvp \
            --output "$RUNNER_TEMP/sway-verification/native"
          python3 - <<'PY'
          import re

          def inspect_operand_control(rtl, expected_operands=None):
              """Inspect BSC continuous-assignment cones at native DSP operand ports.

              Keep write-presence signals outside the operand cones: the compiler may
              share those signals with valid-bit generation. Unresolved identifiers are
              reported as leaves; this function does not parse procedural always blocks.
              The focused test has direct assignments from registered ROM data outputs.
              """
              names = sorted(set(re.findall(r"(?<![\w$])[\w$]*[ab]Wire[$_]whas\b", rtl)))
              drivers = dict(re.findall(r"\bassign\s+([\w$]+)\s*=\s*(.*?);", rtl, re.S))
              ports = re.findall(r"\.dataa[xy]\s*\(\s*([\w$]+)\s*\)", rtl)
              cones = {}
              for signal in ports:
                  pending, seen = [signal], set()
                  while pending:
                      current = pending.pop()
                      if current in seen:
                          continue
                      seen.add(current)
                      if current in drivers:
                          pending.extend(re.findall(r"[A-Za-z_][\w$]*", drivers[current]))
                  cones[signal] = {
                      "signals": sorted(seen),
                      "assignments": {s: drivers[s] for s in sorted(seen) if s in drivers},
                      "leaf_identifiers": sorted(seen - drivers.keys()),
                      "write_presence_dependencies": sorted(set(names) & seen),
                  }
              report = {
                  "status": "pass",
                  "operand_ports": ports,
                  "operand_assignments": [
                      "assign " + signal + " = " + drivers[signal] + ";"
                      for signal in ports if signal in drivers
                  ],
                  "operand_dependency_cones": cones,
                  "retained_write_presence_signals": names,
                  "retained_write_presence_uses": [
                      line.strip() for line in rtl.splitlines()
                      if any(name in line for name in names)
                  ],
                  "scope": "Continuous-assignment operand cones; dollar and underscore identifiers supported. Presence signals outside operand cones are permitted and reported.",
              }
              assert ports and all(signal in drivers for signal in ports), "Operand drivers missing"
              if expected_operands is not None:
                  assert len(ports) == expected_operands, "Unexpected operand port count"
              assert all(not cone["write_presence_dependencies"] for cone in cones.values()), "Operand data cone depends on write-presence control"
              return report

          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"sway-verification/native"
          path=root/"snapshot/iverilog/mkTbNativeMultiply.v"
          report=inspect_operand_control(path.read_text(),expected_operands=2)
          report["generated_rtl_sha256"]=hashlib.sha256(path.read_bytes()).hexdigest()
          (root/"operand-control-isolation.json").write_text(json.dumps(report,indent=2)+"\n")
          print("SWAY_OPERAND_CONTROL_ISOLATION "+json.dumps(report,sort_keys=True))
          PY
      - name: Publish native multiplier report
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"sway-verification/native/report.json"
          if path.is_file():
              print("SWAY_REPORT native/report.json")
              print(path.read_text())
          PY
      - name: Preserve native multiplier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-native-${{ github.sha }}
          path: ${{ runner.temp }}/sway-verification/
          if-no-files-found: warn
          compression-level: 6
