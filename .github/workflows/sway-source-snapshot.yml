name: Baseline build dependencies
on:
  push:
    branches: [main]
    paths: [.github/workflows/sway-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect pinned compiler and synthesis dependencies
        run: |
          mkdir -p /tmp/sway-tools
          cd /tmp/sway-tools
          curl -fL --retry 3 https://github.com/B-Lang-org/bsc/releases/download/2026.01/bsc-2026.01-debian-12.13.tar.gz -o bsc.tar.gz
          echo '9da36623e301ae14ba5e670cb98d11c99277faa915025ccb7615de3ec14002c3  bsc.tar.gz' | sha256sum -c
          sudo apt-get update -qq
          apt-get download yosys-abc
      - uses: actions/upload-artifact@v4
        with:
          name: sway-baseline-compiler
          path: /tmp/sway-tools/
          retention-days: 1
